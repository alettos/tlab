        <section class="scn-cnt">
            <div class="frm-cnt">

                    <h1>Formulario de contacto</h1>
                    <h3>Escríbenos y en breve nos pondremos en contacto contigo</h3>
                    <div class="sep"></div>
                    <p>
                        <label for="nombre" class="lbl-nombre">Nombre</label>
                        <input type="text" id:"nombre" name="nombre" placeholder="Ingresa tu Nombre" required>
                    </p>
                    <p>
                        <label for="mail" class="lbl-mail">Mail:</label>
                        <input type="email" id:"mail" name="mail" placeholder="Tu mail" required>
                    </p>
                    <p>
                        <label for="msg" class="lbl-msg">Mensaje:</label>
                        <textarea type="text" id:"msg" name="msg" placeholder="Ingresa tu msg" required></textarea>
                    </p>
                    <button type="submit">Enviar</button>
                </form>
            </div>
